t.demoNote }}\u003C/span>\n          \u003C/sc-if>\n          \u003Csc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ false }}\">\n            \u003Cbutton onclick=\"{{ goBackHome }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border:1px solid rgba(255,255,255,0.22);border-radius:999px;background:rgba(255,255,255,0.05);color:rgba(245,245,245,0.88);font:500 15px 'IBM Plex Sans',sans-serif;cursor:pointer;transition:transform .08s, background .15s;\" style-active=\"transform:scale(.97)\" style-hover=\"background:rgba(255,255,255,0.1)\">\u003Cspan style=\"font-size:18px;line-height:1;\">\u2039\u003C/span>\u003Cspan>{{ txt.backMenu }}\u003C/span>\u003C/button>\n          \u003C/sc-if>\n        \u003C/div>\n      \u003C/footer>\n    \u003C/div>\n  \u003C/div>\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:1024},&quot;prizeName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;iPad&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9999&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Portugu\u00eas&quot;,&quot;English&quot;],&quot;default&quot;:&quot;Portugu\u00eas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;endpointUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dataUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = {\n      lang: (props && props.defaultLang === 'English') ? 'en' : 'pt',\n      pool: [], isDemo: true, won: [],\n      drawing: false, winner: null, reelName: '', confirmed: false,\n      prize: this._defaultPrize(),\n      locked: true, pinEntry: '', pinError: false, lastRefresh: null,\n      scale: 1,\n    };\n    this._timers = [];\n    this._fit = this._fit.bind(this);\n  }\n  componentDidMount(){ this._fit(); window.addEventListener('resize', this._fit); this._loadPool(); }\n  componentWillUnmount(){ window.removeEventListener('resize', this._fit); this._clear(); }\n  _clear(){ this._timers.forEach(t => clearTimeout(t)); this._timers = []; }\n  _fit(){ this.setState({ scale: Math.max(window.innerWidth/1366, window.innerHeight/1024) }); }\n  _defaultPrize(){\n    // Official draws: Jul 28 2026 -> iPad, Jul 29 2026 -> AirPods. Overridable on screen.\n    try { const d = new Date(); if(d.getFullYear() === 2026 && d.getMonth() === 6 && d.getDate() >= 29) return 'AirPods'; } catch(e){}\n    return 'iPad';\n  }\n\n  _demo(){\n    return [\n      { name:'Ana', lastname:'Souza', company:'Acme Pagamentos', role:'Head of Payments', email:'ana.souza@acme.com' },\n      { name:'Diego', lastname:'Ampuero', company:'LaFinteca', role:'Growth', email:'d.ampuero@la-finteca.com' },\n      { name:'Mariana', lastname:'Lima', company:'ShopBR', role:'CTO', email:'mariana@shopbr.com' },\n      { name:'Carlos', lastname:'Nunes', company:'PayFlow', role:'Product', email:'carlos@payflow.io' },\n      { name:'J\u00falia', lastname:'Ferreira', company:'MercadoX', role:'Operations', email:'julia.f@mercadox.com' },\n      { name:'Rafael', lastname:'Gomes', company:'Nuvem Commerce', role:'CEO', email:'rafa@nuvem.co' },\n      { name:'Beatriz', lastname:'Rocha', company:'Pix Store', role:'Marketing', email:'bia@pixstore.com' },\n      { name:'Lucas', lastname:'Martins', company:'Cart\u00e3oJ\u00e1', role:'Finance', email:'lucas@cartaoja.com' },\n      { name:'Camila', lastname:'Alves', company:'Loja Norte', role:'Founder', email:'camila@lojanorte.com' },\n      { name:'Pedro', lastname:'Henrique', company:'FastCheckout', role:'Engineering', email:'pedro@fastcheckout.dev' },\n    ];\n  }\n  _loadPool(){\n    const url = this.props.dataUrl || 'https://script.google.com/macros/s/AKfycbw2NUOKDW16tHBoCLqUEuVPBiSAp3IJ1l0v0g8Ng7lSDQtXSltsbkMOzRYlQYiOAXHH/exec';\n    if(url){ this._jsonp(url); } else { this._fromLocal(); }\n  }\n  _jsonp(url){\n    // Cross-origin GET of the participant list via \u003Cscript> callback (no CORS issues).\n    const cb = 'fecb_cb_' + Date.now();\n    const self = this;\n    const s = document.createElement('script');\n    const clean = () => { try { delete window[cb]; } catch(e){ window[cb] = undefined; } if(s && s.parentNode) s.parentNode.removeChild(s); };\n    const timer = setTimeout(() => { clean(); self._fromLocal(); }, 8000);\n    window[cb] = (rows) => { clearTimeout(timer); clean(); if(rows && rows.length){ self._setPool(rows, false); } else { self._fromLocal(); } };\n    s.onerror = () => { clearTimeout(timer); clean(); self._fromLocal(); };\n    s.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'action=list&callback=' + cb;\n    document.head.appendChild(s);\n  }\n  _fromLocal(){\n    let rows = [];\n    try { rows = JSON.parse(localStorage.getItem('fecb_leads') || '[]'); } catch(e){}\n    if(rows && rows.length >= 2){ this._setPool(rows, false); } else { this._setPool(this._demo(), true); }\n  }\n  _wonSeed(){\n    // Exclude winners already confirmed on this device (persists across reloads / days).\n    let keys = [];\n    try { keys = JSON.parse(localStorage.getItem('fecb_winners') || '[]').map(w => String(w.email || w.name || '')).filter(Boolean); } catch(e){}\n    return keys;\n  }\n  _setPool(rows, demo){\n    const pool = (rows||[]).map((r,i) => ({\n      _id: i + '|' + (r.email || r.name || Math.random()),\n      key: String(r.email || r.name || ('#'+i)),\n      name: ((r.name||'') + ' ' + (r.lastname||'')).trim() || r.name || '\u2014',\n      company: r.company || '', role: r.role || '', email: r.email || '',\n    })).filter(p => p.name && p.name !== '\u2014');\n    this.setState({ pool, isDemo: demo, won: this._wonSeed(), winner: null, reelName: '', confirmed: false, lastRefresh: Date.now() });\n  }\n  refresh(){ if(this.state.drawing) return; this._loadPool(); }\n\n  pinPress(d){\n    if(!this.state.locked || this.state.pinError) return;\n    const e = (this.state.pinEntry + d).slice(0,4);\n    if(e.length \u003C 4){ this.setState({ pinEntry: e }); return; }\n    const pin = String(this.props.pin || '9999');\n    if(e === pin){ this.setState({ locked: false, pinEntry: '', pinError: false }); }\n    else { this.setState({ pinEntry: e, pinError: true }); this._timers.push(setTimeout(() => this.setState({ pinEntry: '', pinError: false }), 750)); }\n  }\n  pinDel(){ if(this.state.pinError) return; this.setState(st => ({ pinEntry: st.pinEntry.slice(0, -1) })); }\n\n  _recordWinner(w){\n    const rec = { type:'winner', final:'yes', name:w.name, company:w.company, role:w.role, email:w.email, prize: this.state.prize, event:'FORUM ECOMMERCE BRASIL 2026', lang:this.state.lang, timestamp:new Date().toISOString() };\n    try { const arr = JSON.parse(localStorage.getItem('fecb_winners') || '[]'); arr.push(rec); localStorage.setItem('fecb_winners', JSON.stringify(arr)); } catch(e){}\n    const url = this.props.endpointUrl || 'https://script.google.com/macros/s/AKfycbw2NUOKDW16tHBoCLqUEuVPBiSAp3IJ1l0v0g8Ng7lSDQtXSltsbkMOzRYlQYiOAXHH/exec';\n    if(url){ try { fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body: new URLSearchParams(rec).toString() }); } catch(e){} }\n  }\n\n  draw(){\n    if(this.state.drawing || !this.state.pool.length) return;\n    this._clear();\n    let avail = this.state.pool.filter(p => this.state.won.indexOf(p.key) === -1);\n    if(!avail.length) avail = this.state.pool;\n    const winner = avail[Math.floor(Math.random()*avail.length)];\n    const all = this.state.pool;\n    this.setState({ drawing: true, winner: null, confirmed: false });\n    let i = 0, delay = 55;\n    const tick = () => {\n      const r = all[Math.floor(Math.random()*all.length)];\n      this.setState({ reelName: r.name });\n      i++; delay = delay * 1.14;\n      if(delay \u003C 430 && i \u003C 36){ this._timers.push(setTimeout(tick, delay)); }\n      else { this._timers.push(setTimeout(() => { this.setState({ drawing:false, winner, reelName: winner.name }); }, delay)); }\n    };\n    this._timers.push(setTimeout(tick, delay));\n  }\n  confirmWinner(){\n    // A draw is a test until the team confirms. Confirming records the official winner.\n    if(this.state.drawing || !this.state.winner || this.state.confirmed) return;\n    const w = this.state.winner;\n    this._recordWinner(w);\n    this.setState(st => ({ confirmed: true, won: st.won.concat([w.key]) }));\n  }\n  reset(){ if(this.state.drawing) return; this.setState({ winner: null, reelName: '', confirmed: false }); }\n\n  _strings(){\n    const pt = { drawEyebrow:'SORTEIO DAS 17H', prizeLabel:'Pr\u00eamio de hoje', entriesLabel:'participantes',\n      idlePrompt:'Pronto para sortear?', drawBtn:'Sortear ganhador', drawAgain:'Sortear novamente', drawingLabel:'Sorteando\u2026',\n      winnerTag:'Ganhador(a)', resetBtn:'Reiniciar', refresh:'Atualizar lista', refreshedAt:'Atualizado \u00e0s', neverRefreshed:'lista n\u00e3o carregada',\n      lockEyebrow:'Acesso da equipe', lockTitle:'Sorteio do dia', lockSub:'Digite o c\u00f3digo de 4 d\u00edgitos para continuar.', lockError:'C\u00f3digo incorreto', lockBack:'Voltar ao in\u00edcio',\n      confirmBtn:'Confirmar ganhador final', confirmedTag:'Ganhador confirmado', backMenu:'Voltar ao menu',\n      demoNote:'Dados de demonstra\u00e7\u00e3o \u2014 conecte a planilha para usar os contatos reais.' };\n    const en = { drawEyebrow:'5 PM DRAW', prizeLabel:\"Today's prize\", entriesLabel:'entries',\n      idlePrompt:'Ready to draw?', drawBtn:'Draw winner', drawAgain:'Draw again', drawingLabel:'Drawing\u2026',\n      winnerTag:'Winner', resetBtn:'Reset', refresh:'Refresh list
